services:
  kafka:
    # KRaft mode, no ZooKeeper. The image defaults to a single-node broker
    # advertising localhost:9092, which is what the app connects to.
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      # The CLI tool starts a JVM, which alone can take ~10 s.
      interval: 15s
      timeout: 30s
      start_period: 30s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports: ["5432:5432"]
