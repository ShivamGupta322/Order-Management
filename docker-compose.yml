services:
  kafka:
    # KRaft mode, no ZooKeeper. Two listeners: INTERNAL for containers on the
    # compose network (the app), EXTERNAL for tools on the host. A single
    # localhost listener would redirect container clients to their own localhost.
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      # The CLI tool starts a JVM, which alone can take ~10 s.
      interval: 15s
      timeout: 30s
      start_period: 30s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports: ["5432:5432"]
    # The system of record, so its data survives container restarts.
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Erlang app runs in Linux because brod's crc32cer NIF only builds there.
  # In the "dev" profile so `docker compose up -d` starts infrastructure only.
  # Usage: docker compose run --rm --service-ports app rebar3 shell --sname order_processing
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["dev"]
    # Mnesia disc tables are tied to the node name, so the host part
    # (order_processing@app) must stay the same across container restarts.
    hostname: app
    working_dir: /app
    volumes:
      - .:/app
      # Keep Linux build output and the hex cache out of the Windows checkout.
      - app_build:/app/_build
      - rebar3_cache:/root/.cache/rebar3
      - mnesia_data:/var/lib/order_app
    ports: ["8080:8080"]
    depends_on:
      kafka:
        condition: service_healthy
      # The app connects to PostgreSQL at boot when store_impl is order_store_pg.
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: rebar3 shell --sname order_processing

volumes:
  app_build:
  rebar3_cache:
  mnesia_data:
  pg_data:
